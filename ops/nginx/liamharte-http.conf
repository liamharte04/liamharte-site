limit_req_zone $binary_remote_addr zone=liamharte_contact:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name www.liamharte.com;

    return 301 http://liamharte.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name liamharte.com;

    root /var/www/liamharte-site/current/site;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /api/contact {
        limit_req zone=liamharte_contact burst=3 nodelay;
        proxy_pass http://127.0.0.1:3217;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
    }

    location = /health {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    access_log /var/log/nginx/liamharte.access.log;
    error_log /var/log/nginx/liamharte.error.log warn;
}

